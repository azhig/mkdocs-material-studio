name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anything back: the VSIX leaves as an artifact, and
# publishing is the release workflow's business.
permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  check:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # The extension is mostly about paths — docs_dir, `--8<--` includes, url() in
  # extra_css, links between pages — and a path is where Windows differs. Linting
  # and formatting say the same thing on every OS, so only the tests run here.
  os:
    name: Tests on ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Smoke tests in VS Code
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # VS Code is a desktop application: without a display server it exits
      # before the extension host ever starts.
      - name: Integration tests
        run: xvfb-run -a npm run test:integration

  package:
    name: Build VSIX
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Packaging is a check in itself: it catches a broken manifest, a missing
      # icon and files that .vscodeignore lets through by mistake.
      - name: Package
        run: npm run vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
