  <circle cx="60" cy="60" r="22" fill="#7e57c2" />
  <text x="112" y="54" font-size="18" fill="#ede7f6">Dark scheme</text>
  <text x="112" y="78" font-size="13" fill="#b0a8c4">drawn for a dark background</text>
